<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLAX — @blax_.pxrxdise</title>
  <style>
    :root {
      --bg-base: #070709;
      --surface-card: rgba(16, 16, 20, 0.78);
      --surface-card-hover: rgba(30, 30, 36, 0.94);
      --border-color: rgba(255, 255, 255, 0.14);
      --border-hover: rgba(255, 255, 255, 0.36);
      --text-main: #f5f5f7;
      --accent-color: #fd4b93;
      --accent-text: #ffffff;
      --card-radius: 32px;
      --avatar-size: 130px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-vignette {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,7,9,0.45) 0%, rgba(7,7,9,0.31) 46%, rgba(7,7,9,0.69) 100%);
    }
    .page-wrapper {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; justify-content: center; align-items: center; padding: 48px 18px 60px;
    }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .profile-header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
    .avatar-frame {
      width: var(--avatar-size); height: var(--avatar-size); border-radius: 50%; padding: 3px;
      background: linear-gradient(145deg, rgba(255,255,255,0.55), rgba(255,255,255,0.08));
      box-shadow: 0 18px 42px rgba(0,0,0,0.75);
    }
    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #09090b; }
    .brand-title {
      margin-top: 6px; font-size: 1.7rem; font-weight: 900; letter-spacing: 0.18em;
      text-transform: uppercase; text-shadow: 0 2px 14px rgba(0,0,0,0.85);
    }
    .brand-handle { font-size: 0.9rem; opacity: 0.8; letter-spacing: 0.03em; }
    .brand-bio { font-size: 0.92rem; opacity: 0.85; line-height: 1.55; max-width: 34ch; text-shadow: 0 1px 10px rgba(0,0,0,0.9); }
    .link-list { width: 100%; display: flex; flex-direction: column; gap: 13px; }
    .link-card {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 15px 18px; border-radius: var(--card-radius); background-color: var(--surface-card);
      border: 1px solid var(--border-color); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: var(--text-main); text-decoration: none;
      transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
    }
    .link-card:hover { transform: translateY(-2px); background-color: var(--surface-card-hover); border-color: var(--border-hover); }
    .link-card.primary { background-color: var(--accent-color); color: var(--accent-text); border-color: var(--accent-color); backdrop-filter: none; }
    .link-card.primary .link-sub { color: var(--accent-text); opacity: 0.72; }
    .link-card.custom-colored { background-color: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-border); }
    .link-card.custom-colored:hover { filter: brightness(1.08); border-color: var(--btn-text); }
    .link-card.custom-colored .link-sub { color: var(--btn-text); opacity: 0.76; }
    .link-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .link-icon {
      width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
    }
    .link-card.primary .link-icon { background: rgba(0,0,0,0.1); border: none; }
    .link-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .link-title { font-size: 0.96rem; font-weight: 700; }
    .link-sub { font-size: 0.78rem; opacity: 0.72; }
    .link-arrow { font-size: 1rem; font-weight: 700; opacity: 0.82; }
    .footer-note { font-size: 0.72rem; opacity: 0.45; letter-spacing: 0.16em; text-transform: uppercase; text-align: center; }
  </style>
</head>
